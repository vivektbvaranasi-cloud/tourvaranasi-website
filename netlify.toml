# Tour Varanasi production build — content generation + technical validation
[build]
  command = "node scripts/fetch-pmj-images.mjs && node scripts/fetch-destination-images.mjs && node scripts/build-destinations.mjs && node scripts/build-new-sacred-tours.mjs && node scripts/prepare-blog-data.mjs && node scripts/build-blogs.mjs && node scripts/refine-varanasi-content.mjs && node scripts/inject-nav-state.mjs && node scripts/technical-hardening.mjs && node scripts/cwv-hardening.mjs && node scripts/audit-site.mjs && node scripts/crawl-index-audit.mjs"
  publish = "."

[images]
  remote_images = ["https://images.unsplash.com/.*", "https://commons.wikimedia.org/.*", "https://upload.wikimedia.org/.*"]

[[redirects]]
  from = "/tour-varanasi-contact/"
  to = "/plan-my-journey/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/images/pmj-*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Content-Type = "image/png"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/tour-varanasi-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/tripadvisor-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"
